<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Placement Management System (CPMS)</title>
    
    <!-- Google Fonts: Geist, JetBrains Mono, Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        console.error('Fatal Index Catch:', e.error || e.message);
        var r = document.getElementById('root');
        if (r && (!r.children || r.children.length === 0)) {
          r.innerHTML = '<div style="min-height:100vh;background:#F5EEDB;padding:32px;font-family:monospace;color:#000;"><div style="max-width:800px;margin:0 auto;background:#fff;border:3px solid #000;box-shadow:6px 6px 0px 0px #000;padding:24px;border-radius:6px;"><div style="display:inline-block;background:#FF70A6;border:2px solid #000;padding:4px 12px;font-weight:900;margin-bottom:16px;">EARLY SCRIPT ERROR</div><h1 style="font-size:18px;font-weight:900;margin:0 0 12px 0;">' + (e.message || 'Script execution error') + '</h1><p style="font-size:12px;color:#666;">' + (e.filename || '') + ':' + (e.lineno || '') + '</p><pre style="background:#18181b;color:#f43f5e;padding:16px;border-radius:4px;overflow-x:auto;font-size:12px;">' + ((e.error && e.error.stack) ? e.error.stack : e.message) + '</pre><button onclick="localStorage.clear();location.reload();" style="margin-top:16px;background:#FFE600;border:2px solid #000;padding:8px 16px;font-weight:900;cursor:pointer;">Clear Cache & Reload</button></div></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Fatal Promise Rejection:', e.reason);
      });
    </script>
  </head>
  <body class="bg-surface font-sans text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
