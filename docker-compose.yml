version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cpms-postgres
    restart: always
    environment:
      POSTGRES_USER: cpms
      POSTGRES_PASSWORD: cpmspassword
      POSTGRES_DB: cpms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: cpms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: cpms-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  minio_data:
  mailpit_data:

